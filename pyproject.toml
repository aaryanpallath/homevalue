[project]
name = "homevalue"
version = "0.1.0"
description = "An automated valuation model for King County, WA homes: arm's-length sales from the county assessor, a comparable-sales baseline vs gradient boosting, time-honest evaluation, calibrated price ranges, and a small web app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.5", "fastapi>=0.115", "uvicorn>=0.30",
                "joblib>=1.4", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
